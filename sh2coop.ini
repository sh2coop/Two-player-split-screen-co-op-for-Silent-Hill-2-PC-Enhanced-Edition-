; sh2coop.ini - settings of the Silent Hill 2 co-op mod (keep it next to sh2coop.asi)
;
; [input] who controls which James while co-op is on (James 2 spawned).
;   values: auto | keyboard | pad1 | pad2 | keyboard+pad1 | keyboard+pad2   (pad1 = first controller, pad2 = second)
;   auto = the device that presses JOIN (G on the keyboard, or BACK+START together on a pad) becomes James 2's;
;          James 1 keeps the rest. F6 in game swaps the two, F7 resets both to auto.
;   While James 2 is not spawned the game reads everything as usual.
[input]
james1 = auto
james2 = auto

; [split] split screen while James 2 is in: side | top | off
;   (F8 or L3+R3 in game, or Options > Game Options > Co-op Options)
[split]
layout = side

; [coop] troubleshooting switches (1 = on, 0 = off). If something misbehaves, set one to 0 and tell us which one fixed it.
[coop]
; James 2 carries a copy of James 1's weapon
weapon = 1
; enemies go for whichever James is nearer
enemies_target_nearer = 1
; James 2 can use doors, items and save points (doors that open and save points bring James 1 to him; items and
; messages happen where he stands, nobody is moved)
james2_interact = 1
; James 2 wears a red jacket so you can tell the two apart (this is only the starting look: the colours of both
; Jameses are chosen in Options > Game Options > Co-op Options > Appearance and kept in a [look] section below)
james2_red_jacket = 1
; James 2 gets his own bone slots (leave on unless told otherwise)
james2_own_bones = 1
; James 2 has his own flashlight
james2_flashlight = 1
; title screen: 1 = the co-op title (CO-OP under the logo, green background, dark red logo), 0 = the original
title_screen = 1
; texture_dumps: 1 writes a few sh2coop_dump_*.dds snapshots of James's textures into the game folder (only if we ask,
; for a jacket-colour problem). 0 = write nothing.
texture_dumps = 0
